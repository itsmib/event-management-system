<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
<meta charset="UTF-8">
<title>Edit Event</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet"/>
<style>
body { background-color:#f8f9fa; }
.sidebar { background-color:#343a40; color:#fff; min-height:100vh; padding-top:20px; width:250px; position:fixed; top:0; left:0; }
.sidebar-brand { padding:15px 20px; text-align:center; border-bottom:1px solid #555; }
.sidebar-menu { padding:0; list-style:none; }
.sidebar-menu li a { display:block; padding:12px 20px; color:#fff; text-decoration:none; }
.sidebar-menu li a:hover { background-color:#555; }
.content { margin-left:250px; padding:20px; }
.container { background-color:#fff; padding:30px; border-radius:8px; box-shadow:0 0 10px rgba(0,0,0,.1); max-width:700px; margin-top:20px; }
</style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-brand"><h3>Admin Panel</h3></div>
    <ul class="sidebar-menu">
        <li><a href="/admin/dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
        <li><a href="/admin/create-event"><i class="bi bi-plus-circle"></i> Add Event</a></li>
        <li><a href="/admin/my-events"><i class="bi bi-calendar-event"></i> Manage Events</a></li>
        <li><a href="/admin/edit_profile"><i class="bi bi-person-fill"></i> Edit Profile</a></li>
        <li><a href="/admin/reminder"><i class="bi bi-bell"></i> Reminder</a></li>
        <li><a href="#" onclick="event.preventDefault(); document.getElementById('logoutSidebarForm').submit();"><i class="bi bi-box-arrow-left"></i> Logout</a></li>
    </ul>
</div>

<div class="content">
    <h2 class="mb-4">Edit Event</h2>
    <div class="container">
        <div id="errorMessage" class="alert alert-danger d-none"></div>
        <form id="editEventForm" enctype="multipart/form-data" th:attr="data-event-id=${event.eventId}">
            <input type="hidden" id="csrfToken" th:value="${_csrf.token}"/>
            <input type="hidden" id="csrfHeader" th:value="${_csrf.headerName}"/>

            <div class="mb-3"><label class="form-label" for="name">Event Name</label><input class="form-control" id="name" name="name" th:value="${event.name}" required></div>
            <div class="mb-3"><label class="form-label" for="category">Category</label><input class="form-control" id="category" name="category" th:value="${event.category}" required></div>
            <div class="mb-3"><label class="form-label" for="location">Location</label><input class="form-control" id="location" name="location" th:value="${event.location}" required></div>
            <div class="mb-3"><label class="form-label" for="eventDate">Event Date</label><input type="date" class="form-control" id="eventDate" name="eventDate" th:value="${event.eventDate}" required></div>
            <div class="mb-3"><label class="form-label" for="eventTime">Event Time</label><input type="time" class="form-control" id="eventTime" name="eventTime" th:value="${event.eventTime}" required></div>
            <div class="mb-3"><label class="form-label">Tickets Remaining</label><input type="number" class="form-control" th:value="${event.totalTickets}" disabled></div>
            <div class="form-text mb-3">Remaining ticket inventory is managed by bookings and cannot be changed while editing the event.</div>
            <div class="mb-3"><label class="form-label" for="description">Description</label><textarea class="form-control" id="description" name="description" rows="4" th:text="${event.description}"></textarea></div>
            <div class="mb-3"><label class="form-label" for="imageFile">Replace Event Picture</label><input type="file" class="form-control" id="imageFile" name="imageFile" accept="image/*"></div>

            <button type="submit" class="btn btn-primary">Update Event</button>
            <a href="/admin/my-events" class="btn btn-secondary ms-2">Cancel</a>
        </form>
    </div>
</div>

<form id="logoutSidebarForm" th:action="@{/logout}" method="post" style="display:none;">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
</form>

<script>
document.getElementById('editEventForm').addEventListener('submit', async function (event) {
    event.preventDefault();
    const id = this.dataset.eventId;
    const response = await fetch('/api/events/' + id, {
        method: 'PUT',
        headers: { [document.getElementById('csrfHeader').value]: document.getElementById('csrfToken').value },
        body: new FormData(this)
    });

    if (response.ok) {
        window.location.href = '/admin/my-events';
        return;
    }

    const error = document.getElementById('errorMessage');
    error.textContent = response.status === 403 ? 'You are not authorized to edit this event.' : 'Unable to update event.';
    error.classList.remove('d-none');
});
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
