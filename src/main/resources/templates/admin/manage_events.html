<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
<meta charset="UTF-8">
<title>Manage My Events</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet"/>
<style>
body { background-color:#f8f9fa; }
.sidebar { background-color:#343a40; color:#fff; min-height:100vh; padding-top:20px; width:250px; position:fixed; top:0; left:0; }
.sidebar-brand { padding:15px 20px; text-align:center; border-bottom:1px solid #555; }
.sidebar-menu { padding:0; list-style:none; }
.sidebar-menu li a { display:block; padding:12px 20px; color:#fff; text-decoration:none; }
.sidebar-menu li a:hover { background-color:#555; }
.content { margin-left:250px; padding:20px; }
.container { background-color:#fff; padding:20px; border-radius:8px; box-shadow:0 0 10px rgba(0,0,0,.1); margin-top:20px; }
</style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-brand"><h3>Admin Panel</h3></div>
    <ul class="sidebar-menu">
        <li><a href="/admin/dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
        <li><a href="/admin/create-event"><i class="bi bi-plus-circle"></i> Add Event</a></li>
        <li><a href="/admin/my-events"><i class="bi bi-calendar-event"></i> Manage Events</a></li>
        <li><a href="/admin/edit_profile"><i class="bi bi-person-fill"></i> Edit Profile</a></li>
        <li><a href="/admin/reminder"><i class="bi bi-bell"></i> Reminder</a></li>
        <li><a href="#" onclick="event.preventDefault(); document.getElementById('logoutSidebarForm').submit();"><i class="bi bi-box-arrow-left"></i> Logout</a></li>
    </ul>
</div>

<div class="content">
    <h2 class="mb-4">Manage My Events</h2>
    <input type="hidden" id="csrfToken" th:value="${_csrf.token}"/>
    <input type="hidden" id="csrfHeader" th:value="${_csrf.headerName}"/>

    <div class="container">
        <div th:if="${myEvents.isEmpty()}" class="alert alert-info">You have not created any events yet.</div>
        <div th:if="${!myEvents.isEmpty()}">
            <table class="table table-striped">
                <thead class="table-dark"><tr><th>Name</th><th>Date</th><th>Time</th><th>Actions</th></tr></thead>
                <tbody>
                <tr th:each="event : ${myEvents}" th:id="'event-row-' + ${event.eventId}">
                    <td th:text="${event.name}">Event</td>
                    <td th:text="${#temporals.format(event.eventDate, 'dd MMM yyyy')}">Date</td>
                    <td th:text="${#temporals.format(event.eventTime, 'hh:mm a')}">Time</td>
                    <td>
                        <a th:href="@{/admin/edit-event/{id}(id=${event.eventId})}" class="btn btn-sm btn-primary me-2">Edit</a>
                        <button type="button" class="btn btn-sm btn-danger me-2" th:attr="data-event-id=${event.eventId}" onclick="deleteEvent(this)">Delete</button>
                        <form th:action="@{'/admin/send-reminders/' + ${event.eventId}}" method="post" style="display:inline;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-warning btn-sm">Send Reminders</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<form id="logoutSidebarForm" th:action="@{/logout}" method="post" style="display:none;">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
</form>

<script>
async function deleteEvent(button) {
    if (!confirm('Delete this event?')) return;

    const id = button.dataset.eventId;
    const response = await fetch('/api/events/' + id, {
        method: 'DELETE',
        headers: { [document.getElementById('csrfHeader').value]: document.getElementById('csrfToken').value }
    });

    if (response.ok) {
        document.getElementById('event-row-' + id).remove();
        return;
    }

    alert(response.status === 403 ? 'You are not authorized to delete this event.' : 'Unable to delete event.');
}
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
